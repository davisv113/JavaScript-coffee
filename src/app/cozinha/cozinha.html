<!-- Luzes -->
<ngt-hemisphere-light [intensity]="luzAmbiente()" color="#fff3e0" groundColor="#6b4a32" />
<ngt-ambient-light [intensity]="escuro() ? 0.25 : 0.35" />
<ngt-directional-light
  #sol
  [position]="[-4, 6, 4]"
  [intensity]="luzSol()"
  [color]="escuro() ? '#8fa8ff' : '#fff1d6'"
  [castShadow]="true"
/>
<!-- Lâmpada quente que acende no modo escuro -->
<ngt-point-light [position]="[0.4, 3.4, 1.2]" [intensity]="luzLampada()" color="#ffb066" [distance]="9" />

<!-- Parede de azulejo -->
<ngt-mesh [position]="[0, 1.6, -1.25]" [receiveShadow]="true">
  <ngt-plane-geometry *args="[14, 6]" />
  <ngt-mesh-standard-material [map]="azulejo" [roughness]="0.6" />
</ngt-mesh>

<!-- Janela -->
<ngt-group [position]="[-2.6, 2.35, -1.22]">
  <ngt-mesh>
    <ngt-box-geometry *args="[1.5, 1.2, 0.06]" />
    <ngt-mesh-standard-material color="#f7f3ec" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 0, 0.035]">
    <ngt-plane-geometry *args="[1.3, 1.0]" />
    <ngt-mesh-basic-material [color]="ceu()" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 0, 0.04]">
    <ngt-box-geometry *args="[0.05, 1.0, 0.02]" />
    <ngt-mesh-standard-material color="#f7f3ec" />
  </ngt-mesh>
  @if (escuro()) {
    <ngt-mesh [position]="[0.35, 0.22, 0.04]">
      <ngt-sphere-geometry *args="[0.09, 16, 12]" />
      <ngt-mesh-basic-material color="#f6efd2" />
    </ngt-mesh>
  } @else {
    <ngt-mesh [position]="[0.35, 0.22, 0.04]">
      <ngt-sphere-geometry *args="[0.12, 16, 12]" />
      <ngt-mesh-basic-material color="#ffe08a" />
    </ngt-mesh>
  }
</ngt-group>

<!-- Bancada e armário -->
<ngt-mesh [position]="[0, -0.15, 0]" [receiveShadow]="true" [castShadow]="true">
  <ngt-box-geometry *args="[8, 0.3, 2.6]" />
  <ngt-mesh-standard-material color="#3b3633" [roughness]="0.45" />
</ngt-mesh>
<ngt-mesh [position]="[0, -1.4, 0.05]" [receiveShadow]="true">
  <ngt-box-geometry *args="[7.8, 2.2, 2.4]" />
  <ngt-mesh-standard-material color="#c98f5a" [roughness]="0.8" />
</ngt-mesh>
@for (x of [-2.9, -0.95, 0.95, 2.9]; track x) {
  <ngt-mesh [position]="[x, -0.75, 1.26]">
    <ngt-box-geometry *args="[0.6, 0.06, 0.06]" />
    <ngt-mesh-standard-material color="#e8e2d8" [metalness]="0.4" [roughness]="0.3" />
  </ngt-mesh>
}

<!-- Pia -->
<ngt-group [position]="[2.1, 0, 0.1]">
  <ngt-mesh [position]="[0, 0.006, 0]" [receiveShadow]="true">
    <ngt-box-geometry *args="[1.8, 0.012, 1.4]" />
    <ngt-mesh-standard-material color="#c7ccd1" [metalness]="0.3" [roughness]="0.35" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 0.014, 0.05]">
    <ngt-box-geometry *args="[1.5, 0.006, 1.05]" />
    <ngt-mesh-standard-material color="#8f969d" [metalness]="0.3" [roughness]="0.5" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 0.02, 0.05]">
    <ngt-cylinder-geometry *args="[0.09, 0.09, 0.004, 20]" />
    <ngt-mesh-standard-material color="#4a4f55" />
  </ngt-mesh>
  <!-- Torneira -->
  <ngt-group [position]="[0, 0, -0.62]">
    <ngt-mesh [position]="[0, 0.45, 0]" [castShadow]="true">
      <ngt-cylinder-geometry *args="[0.06, 0.08, 0.9, 16]" />
      <ngt-mesh-standard-material color="#d9dde1" [metalness]="0.5" [roughness]="0.2" />
    </ngt-mesh>
    <ngt-mesh [position]="[0, 0.9, 0.25]" [rotation]="[PI / 2, 0, 0]" [castShadow]="true">
      <ngt-cylinder-geometry *args="[0.05, 0.05, 0.55, 16]" />
      <ngt-mesh-standard-material color="#d9dde1" [metalness]="0.5" [roughness]="0.2" />
    </ngt-mesh>
    <ngt-mesh [position]="[0, 0.84, 0.5]">
      <ngt-cylinder-geometry *args="[0.055, 0.045, 0.14, 16]" />
      <ngt-mesh-standard-material color="#d9dde1" [metalness]="0.5" [roughness]="0.2" />
    </ngt-mesh>
    <ngt-mesh [position]="[0.2, 0.12, 0]" [castShadow]="true">
      <ngt-box-geometry *args="[0.1, 0.06, 0.22]" />
      <ngt-mesh-standard-material color="#d9dde1" [metalness]="0.5" [roughness]="0.2" />
    </ngt-mesh>
  </ngt-group>
</ngt-group>

<!-- Garrafa com coador -->
<ngt-group [position]="[-0.4, 0, 0.15]">
  <!-- Base e bocal vermelhos -->
  <ngt-mesh [position]="[0, 0.06, 0]" [castShadow]="true">
    <ngt-cylinder-geometry *args="[0.52, 0.54, 0.12, 32]" />
    <ngt-mesh-standard-material color="#c0392b" [roughness]="0.5" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 1.5, 0]" [castShadow]="true">
    <ngt-cylinder-geometry *args="[0.42, 0.5, 0.14, 32]" />
    <ngt-mesh-standard-material color="#c0392b" [roughness]="0.5" />
  </ngt-mesh>

  <!-- Café dentro da garrafa (escala Y = nível) -->
  <ngt-group #liquido [position]="[0, 0.12, 0]">
    <ngt-mesh [position]="[0, 0.65, 0]">
      <ngt-cylinder-geometry *args="[0.45, 0.45, 1.3, 32]" />
      <ngt-mesh-standard-material color="#4a2814" [roughness]="0.2" />
    </ngt-mesh>
  </ngt-group>

  <!-- Vidro -->
  <ngt-mesh [position]="[0, 0.78, 0]">
    <ngt-cylinder-geometry *args="[0.49, 0.49, 1.32, 32, 1, true]" />
    <ngt-mesh-standard-material
      color="#e3f1f6"
      [transparent]="true"
      [opacity]="0.28"
      [roughness]="0.05"
      [depthWrite]="false"
      [side]="DoubleSide"
    />
  </ngt-mesh>

  <!-- Alça -->
  <ngt-mesh [position]="[-0.52, 0.8, 0]" [rotation]="[0, 0, PI / 2]" [castShadow]="true">
    <ngt-torus-geometry *args="[0.36, 0.06, 10, 24, PI]" />
    <ngt-mesh-standard-material color="#c0392b" [roughness]="0.5" />
  </ngt-mesh>

  <!-- Suporte do coador -->
  <ngt-mesh [position]="[0, 1.6, 0]" [castShadow]="true">
    <ngt-cylinder-geometry *args="[0.5, 0.5, 0.05, 32]" />
    <ngt-mesh-standard-material color="#e8e3da" [roughness]="0.6" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 1.9, 0]" [castShadow]="true">
    <ngt-cylinder-geometry *args="[0.62, 0.24, 0.6, 32, 1, true]" />
    <ngt-mesh-standard-material color="#e8e3da" [roughness]="0.6" [side]="DoubleSide" />
  </ngt-mesh>

  <!-- Filtro de papel -->
  <ngt-mesh [position]="[0, 1.97, 0]">
    <ngt-cylinder-geometry *args="[0.6, 0.2, 0.64, 32, 1, true]" />
    <ngt-mesh-standard-material color="#f3e6c8" [roughness]="0.95" [side]="DoubleSide" />
  </ngt-mesh>

  <!-- Pó de café -->
  <!-- Cone com vértice onde as paredes do filtro se encontram: escala uniforme sem atravessar o papel -->
  <ngt-group #po [position]="[0, 1.33, 0]">
    <ngt-mesh [position]="[0, 0.45, 0]">
      <ngt-cylinder-geometry *args="[0.53, 0.001, 0.9, 32]" />
      <ngt-mesh-standard-material color="#2a170c" [roughness]="1" />
    </ngt-mesh>
  </ngt-group>
</ngt-group>

<!-- Gotas caindo -->
@for (i of gotas; track i) {
  <ngt-mesh #gota [position]="[-0.4, 1.6, 0.15]">
    <ngt-sphere-geometry *args="[0.035, 8, 6]" />
    <ngt-mesh-standard-material color="#4a2a17" [roughness]="0.2" />
  </ngt-mesh>
}

<!-- Fumacinha -->
@for (i of vapores; track i) {
  <ngt-mesh #vapor>
    <ngt-sphere-geometry *args="[1, 12, 8]" />
    <ngt-mesh-standard-material
      color="#ffffff"
      [transparent]="true"
      [opacity]="0"
      [depthWrite]="false"
      [roughness]="1"
    />
  </ngt-mesh>
}

<!-- Açucareiro -->
<ngt-group [position]="[-1.75, 0, 0.55]">
  <ngt-mesh [position]="[0, 0.42, 0]" [rotation]="[PI, 0, 0]" [castShadow]="true">
    <ngt-sphere-geometry *args="[0.42, 24, 12, 0, PI * 2, 0, PI / 2]" />
    <ngt-mesh-standard-material color="#5b8fb9" [roughness]="0.4" [side]="DoubleSide" />
  </ngt-mesh>
  <ngt-mesh #acucar [position]="[0, 0.32, 0]">
    <ngt-sphere-geometry *args="[0.38, 20, 10, 0, PI * 2, 0, PI / 2]" />
    <ngt-mesh-standard-material color="#fbfaf6" [roughness]="1" />
  </ngt-mesh>
  <!-- Colher -->
  <ngt-mesh [position]="[0.2, 0.55, 0]" [rotation]="[0, 0, -0.9]" [castShadow]="true">
    <ngt-box-geometry *args="[0.05, 0.6, 0.02]" />
    <ngt-mesh-standard-material color="#d9dde1" [metalness]="0.5" [roughness]="0.25" />
  </ngt-mesh>
</ngt-group>

<!-- Pacote de café -->
<ngt-group [position]="[-1.6, 0, -0.65]" [rotation]="[0, 0.35, 0]">
  <ngt-mesh [position]="[0, 0.45, 0]" [castShadow]="true">
    <ngt-box-geometry *args="[0.6, 0.9, 0.3]" />
    <ngt-mesh-standard-material color="#7a1f1a" [roughness]="0.7" />
  </ngt-mesh>
  <ngt-mesh [position]="[0, 0.5, 0.152]">
    <ngt-plane-geometry *args="[0.46, 0.32]" />
    <ngt-mesh-standard-material color="#f2c14e" [roughness]="0.7" />
  </ngt-mesh>
</ngt-group>

<!-- Caneca -->
<ngt-group [position]="[0.75, 0, 0.75]" [rotation]="[0, -0.6, 0]">
  <ngt-mesh [position]="[0, 0.2, 0]" [castShadow]="true">
    <ngt-cylinder-geometry *args="[0.2, 0.18, 0.4, 24]" />
    <ngt-mesh-standard-material color="#f0ebe3" [roughness]="0.4" />
  </ngt-mesh>
  <ngt-mesh [position]="[0.19, 0.2, 0]" [rotation]="[0, 0, -PI / 2]" [castShadow]="true">
    <ngt-torus-geometry *args="[0.1, 0.03, 8, 16, PI]" />
    <ngt-mesh-standard-material color="#f0ebe3" [roughness]="0.4" />
  </ngt-mesh>
</ngt-group>
